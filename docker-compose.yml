services:
  grav:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
        GRAV_VERSION: ${GRAV_VERSION:-2.1.8}
    restart: unless-stopped
    ports:
      - "${GRAV_PORT:-3097}:80"
    volumes:
      - grav_accounts:/var/www/html/user/accounts
      - grav_config:/var/www/html/user/config
      - grav_data:/var/www/html/user/data
      - grav_assets:/var/www/html/user/assets
      - grav_media:/var/www/html/user/media
      - grav_pages:/var/www/html/user/pages
      - grav_plugins:/var/www/html/user/plugins
      - grav_backup:/var/www/html/backup
      - grav_logs:/var/www/html/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 5

volumes:
  grav_accounts:
  grav_config:
  grav_data:
  grav_assets:
  grav_media:
  grav_pages:
  grav_plugins:
  grav_backup:
  grav_logs:
